<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C8-BTBT 라인 패터닝</title>
<style>
  :root{
    --bg1:#fbfbfc; --bg2:#e4e8ee; --ink:#262a33; --ink2:#5d6370; --line:#d6dbe3;
    --panel:rgba(255,255,255,.95); --accent:#d99a16; --pdms:#4b9fbf; --sio:#6c5fc9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:var(--ink);
    background:radial-gradient(ellipse at 40% 40%,var(--bg1) 0%,var(--bg2) 100%)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
  html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  #gl.hover{cursor:pointer} #gl.drag{cursor:grabbing}
  header{position:fixed;left:26px;top:20px;pointer-events:none}
  header h1{margin:0;font:700 26px "Segoe UI","Malgun Gothic",sans-serif;letter-spacing:-.3px}
  header p{margin:4px 0 0;color:var(--ink2);font-size:14px}
  #tools{position:fixed;right:18px;top:18px;display:flex;gap:8px;z-index:3}
  button.tb{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(30,40,60,.06)}
  button.tb:hover{background:#f2f5f9}
  #hint{position:fixed;left:18px;right:436px;bottom:74px;text-align:center;font-size:12.5px;color:var(--ink2);pointer-events:none}
  #hint span{background:rgba(255,255,255,.78);padding:5px 14px;border-radius:20px;border:1px solid var(--line)}
  /* 호버 콜아웃 */
  #callout{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}
  #callout polyline{fill:none;stroke:#3a3d44;stroke-width:1.8;stroke-linejoin:round}
  #callout .ring{fill:#fff;stroke:#3a3d44;stroke-width:2}
  #callout .pip{fill:#3a3d44}
  #callout text{font:italic 700 19px "Segoe UI","Malgun Gothic",sans-serif;fill:#3a3d44;letter-spacing:.5px}
  #callout text .en{font:italic 400 13px "Segoe UI",sans-serif;fill:#7a7f8a;letter-spacing:.3px}
  /* 장면 라벨 */
  .opl{position:fixed;pointer-events:none;transform:translate(-50%,-50%);font:700 13.5px "Segoe UI","Malgun Gothic",sans-serif;
    padding:3px 9px;border-radius:14px;background:rgba(255,255,255,.9);border:1px solid var(--line);white-space:nowrap;opacity:0}
  /* 타임라인 */
  #timeline{position:fixed;left:18px;right:436px;bottom:16px;display:flex;gap:8px;z-index:3}
  #play{width:48px;padding:0;font-size:16px}
  #chips{flex:1;display:flex;gap:5px;touch-action:none}
  .chip{position:relative;flex:1;min-width:0;height:46px;border-radius:10px;background:#fff;border:1px solid var(--line);
    overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 10px;user-select:none;box-shadow:0 2px 8px rgba(30,40,60,.05)}
  .chip .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(217,154,22,.16)}
  .chip .n{position:relative;flex:none;width:21px;height:21px;border-radius:50%;background:#e9ecf1;color:var(--ink2);
    font:700 12px "Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
  .chip .t{position:relative;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.done .n{background:#f3dfae;color:#7a5508}
  .chip.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,154,22,.25)}
  .chip.on .n{background:var(--accent);color:#fff}
  .chip.on .t{font-weight:700}
  /* 정보 패널 */
  #info{position:fixed;top:70px;right:18px;bottom:16px;width:400px;overflow:auto;padding:22px 24px 20px;z-index:3;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(30,40,60,.14)}
  #info .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
  .tag{padding:3px 9px;border-radius:20px;font-weight:700;font-size:11.5px;color:#fff}
  #info .x{margin-left:auto;border:0;background:#eef1f5;padding:6px 11px;border-radius:16px;cursor:pointer;font-size:12px;color:var(--ink2)}
  #info h2{margin:12px 0 2px;font-size:25px;letter-spacing:-.4px}
  #info .en{font-family:"Segoe UI",sans-serif;color:var(--ink2);font-size:14px}
  #info .sum{margin:14px 0 12px;font-size:16px;line-height:1.6;font-weight:600}
  .cap{padding:10px 13px;font-size:13.5px;color:#7a5508;background:#fdf5e1;border:1px solid #f1dc9c;border-radius:10px;line-height:1.55}
  #info h4{margin:16px 0 6px;font-size:13px;color:var(--ink2);letter-spacing:.3px}
  #info ul{margin:0;padding-left:18px;line-height:1.7;font-size:14.5px}
  #info p.mat{margin:0;font-size:14.5px;line-height:1.6}
  .sect{width:100%;height:auto;display:block;background:#f7f8fa;border:1px solid var(--line);border-radius:10px}
  .molsvg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
  .note{margin-top:10px;font-size:12px;color:#8a8f99}
  .nav{display:flex;gap:8px;margin-top:18px}
  .nav button{flex:1}
</style>
</head>

<script>

    roles:['증발을 한 방향으로 유도 → 접촉선이 일정하게 후퇴','핵생성은 한 곳에서만, 이후 새 핵 없이 기존 결정만 성장 → 결정립계(grain boundary) 없음','분자가 기판에 거의 수직으로 서서 층상(lamellar) 구조 · 결정면이 드러난 각진(facet) 성장 전선','결정립계가 없어 전하 산란 ↓ → 다결정보다 이동도 ↑'],
    cond:['기판을 살짝 기울이거나 한쪽만 열어 증발 방향 제어','덮개·용매 분위기로 증발을 느리게 (과포화를 낮게 유지 → 추가 핵생성 억제)','고비점 용매(클로로벤젠, 아니솔 등) 사용','건조 후 진공 건조로 잔류 용매 제거'], leg:['mol','sol'], mol:true},
  {name:'PDMS 스탬프 정렬', en:'Stamp alignment', dur:4.5, col:'#4b9fbf',

  {name:'박리', en:'Peel-off', dur:4.5, col:'#4b9fbf',
    summary:'스탬프를 떼어내면 흡수된 결정이 스탬프와 함께 제거됩니다.',
    caption:'스탬프가 한쪽부터 들리며 떨어집니다. 돌기에는 흡수된 C8-BTBT가 남아 있습니다.',

    cond:['한쪽 끝부터 천천히 박리'], leg:[]},
  {name:'라인 패턴 완성', en:'Patterned crystal lines', dur:4, col:'#4f9a2e',
    summary:'홈 아래에 있던 결정만 남아 C8-BTBT 단결정 라인 패턴이 완성됩니다. 모든 라인이 같은 결정 방향을 가집니다.',
    caption:'반짝이는 줄이 남은 결정 라인입니다. 라인 사이(돌기가 닿았던 자리)는 깨끗한 SiO₂ 입니다.',
    roles:['라인 폭 = 스탬프 홈 폭, 라인 간격 = 돌기 폭','한 단결정에서 잘라낸 라인 → 라인마다 결정 방향·특성이 균일','라인 사이 결정 제거 → 소자 간 누설전류·크로스토크 감소','이후 소스/드레인 전극(Au) 증착 → OFET 어레이'],
    cond:['편광현미경(POM)으로 결정성·라인 확인','AFM으로 두께·단차 확인'], leg:[]},
];
const PART = {
  si:{name:'Si 웨이퍼', en:'Silicon wafer (n⁺⁺)', col:'#5d6168',
    summary:'기판이자 트랜지스터(OFET)의 게이트 전극으로 쓰이는 고농도 도핑 실리콘입니다.',
    roles:['기계적 지지체 (매끈하고 평평함)','고농도 도핑 → 바닥 게이트 전극으로 사용'],
    material:'n⁺⁺ 또는 p⁺⁺ Si (비저항 < 0.005 Ω·cm)'},
  sio2:{name:'SiO₂ 절연막', en:'Thermal SiO₂ dielectric', col:'#6c5fc9',
    summary:'결정이 자라는 표면이자 트랜지스터의 게이트 절연막입니다.',
    roles:['게이트 절연 (300 nm일 때 Cᵢ ≈ 11.5 nF/cm²)','매끈한 표면 → 결정 핵생성·성장의 바탕','표면처리(UV-O₃, OTS·HMDS)로 젖음성 조절'],
    material:'열산화 SiO₂ (보라~파랑 간섭색)'},
  drop:{name:'C8-BTBT 용액', en:'C8-BTBT solution', col:'#3b8fd1',
    summary:'저분자 유기반도체를 유기용매에 녹인 용액입니다. 증발하면서 분자가 모여 결정이 됩니다.',
    roles:['용매 끓는점·농도 → 증발 속도·결정 크기를 결정','가장자리 증발이 빨라 바깥 → 안쪽으로 결정화'],
    material:'톨루엔, 클로로벤젠, 아니솔 등 + C8-BTBT 0.5–1 wt%'},
  crystal:{name:'C8-BTBT 단결정', en:'Single-crystal C8-BTBT', col:'#d99a16',
    summary:'하나의 핵에서 자란, 결정립계가 없는 판상 단결정입니다. 분자가 기판에 거의 수직으로 서서 층층이 쌓여 있습니다.',
    roles:['BTBT 코어끼리 헤링본 패킹 → 정공(p형) 전하 이동 통로','결정립계 없음 → 전하 산란·트랩 ↓','옥틸 사슬이 층 사이를 채움 → 용해성·층상 구조 (분자층 단차 = 테라스)','높은 정공 이동도 (수 ~ 10 cm²/V·s 이상 보고)'],
    material:'2,7-dioctyl[1]benzothieno[3,2-b][1]benzothiophene · C₃₀H₄₀S₂ · 464.8 g/mol', mol:true},
  stamp:{name:'PDMS 스탬프', en:'Polydimethylsiloxane stamp', col:'#4b9fbf',
    summary:'라인 돌기가 새겨진 투명한 탄성체 스탬프로, 닿는 곳의 C8-BTBT를 흡수해 떼어냅니다.',
    roles:['낮은 표면에너지·탄성 → 결정과 고르게(conformal) 밀착','소수성 고분자 망 → 소수성 저분자가 확산해 들어감','마스터 몰드(Si / SU-8)에서 복제 경화'],
    material:'Sylgard 184 (주제:경화제 = 10:1)'},
  ridge:{name:'스탬프 돌기', en:'Stamp ridge (contact area)', col:'#c9772a',
    summary:'결정과 직접 맞닿는 부분 — 이 아래의 결정만 흡수되어 사라집니다.',
    roles:['돌기 폭 = 제거되는 폭','홈(돌기 사이) 폭 = 남는 결정 라인 폭','흡수된 분자는 스탬프 안에 남아 함께 떨어져 나감'],
    material:'PDMS (스탬프와 일체)'},
  pipette:{name:'마이크로 피펫', en:'Micropipette', col:'#8a8f98',
    summary:'정해진 부피의 용액을 기판 위에 떨어뜨립니다.',
    roles:['부피 10–30 µL','떨어뜨린 부피·퍼진 면적 → 결정막 두께'],

/* ======================================================= 유틸 */
const clamp01 = u => Math.max(0, Math.min(1, u));
const eio = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(u));
const ramp = (u, a = .1, b = .1) => clamp01(u / a) * clamp01((1 - u) / b);
function seeded(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const RN = (() => { const r = seeded(42); return Array.from({length: 512}, () => r()); })();
const rr = (k, j) => RN[(k * 37 + j * 11) % 512];

/* ======================================================= 패턴 기하 */
const R = 80;                 // 라벨 배치 기준
const EX = 134.5, EZ = 104.5; // 기판 윗면 반폭 (결정이 덮는 영역)
const DA = 133, DB = 103;     // 퍼진 용액 반폭 (둥근 사각형)
const sNorm = (x, z) => Math.pow(Math.pow(Math.abs(x) / DA, 6) + Math.pow(Math.abs(z) / DB, 6), 1 / 6);
const HW = 11, PER = 22;      // 돌기 폭 = 홈 폭 = 11, 피치 22
const isRidge = x => ((Math.floor(x / HW) % 2) + 2) % 2 === 0;

/* ======================================================= C8-BTBT 분자 구조 (SVG) */
function moleculeSVG(){
  const b = 14, segs = [], atoms = [], circles = [];
  const ang = (p, c) => Math.atan2(p[1] - c[1], p[0] - c[0]);
  function ring(P, Q, n, away){   // P-Q 변을 공유하는 정n각형 (away 반대쪽으로)
    const mx = (P[0] + Q[0]) / 2, my = (P[1] + Q[1]) / 2, ex = Q[0] - P[0], ey = Q[1] - P[1], L = Math.hypot(ex, ey);
    let nx = -ey / L, ny = ex / L; if ((away[0] - mx) * nx + (away[1] - my) * ny > 0){ nx = -nx; ny = -ny; }
    const apo = b / (2 * Math.tan(Math.PI / n)), rc = b / (2 * Math.sin(Math.PI / n)), c = [mx + nx * apo, my + ny * apo];
    let a0 = ang(P, c), d = ang(Q, c) - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    const v = []; for (let k = 0; k < n; k++) v.push([c[0] + rc * Math.cos(a0 + d * k), c[1] + rc * Math.sin(a0 + d * k)]);
    for (let k = 0; k < n; k++) segs.push([v[k], v[(k + 1) % n]]);
    return {v, c};
  }
  const A = [0, -b / 2], B = [0, b / 2];
  const pr = ring(A, B, 5, [-10, 0]);                         // 오른쪽 오각형: v0=A, v1=B, v2, v3, v4
  const pl = ring([-A[0], -A[1]], [-B[0], -B[1]], 5, [10, 0]); // 왼쪽 (점대칭)
  atoms.push(pr.v[4], pl.v[4]);                                // S 위치 (반대편, [3,2-b])
  const hr = ring(pr.v[2], pr.v[3], 6, pr.c), hl = ring(pl.v[2], pl.v[3], 6, pl.c);
  circles.push(hr.c, hl.c);
  const tails = [];
  for (const h of [hr, hl]){
    const sgn = h === hr ? 1 : -1;
    let tipv = h.v.reduce((m, p) => (p[0] * sgn > m[0] * sgn ? p : m), h.v[0]);
    const dir = [sgn, 0], pts = [tipv];
    for (let k = 1; k <= 8; k++) pts.push([tipv[0] + dir[0] * k * b * .87, tipv[1] + (k % 2 ? -b * .5 : 0)]);

  const all = segs.flat(); const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs) - 34, x1 = Math.max(...xs) + 34, y0 = Math.min(...ys) - 14, y1 = Math.max(...ys) + 16;
  let o = `<svg class="molsvg" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">`;
  segs.forEach(([p, q]) => o += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#333" stroke-width="1.6" stroke-linecap="round"/>`);
  circles.forEach(c => o += `<circle cx="${c[0]}" cy="${c[1]}" r="${b * .52}" fill="none" stroke="#333" stroke-width="1.1"/>`);
  atoms.forEach(p => o += `<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="#fff"/><text x="${p[0]}" y="${p[1] + 4.2}" font-size="12" font-weight="700" fill="#b8860b" text-anchor="middle">S</text>`);
  o += `<text x="${tails[0][0] + 4}" y="${tails[0][1] + 4}" font-size="10" fill="#666">C₈H₁₇</text>`;
  o += `<text x="${tails[1][0] - 4}" y="${tails[1][1] + 4}" font-size="10" fill="#666" text-anchor="end">C₈H₁₇</text>`;
  o += `<text x="0" y="${y1 - 3}" font-size="9.5" fill="#888" text-anchor="middle">BTBT 코어 (전하 이동) + 옥틸 사슬 ×2 (용해성)</text>`;
  return o + '</svg>';
}

  const p1 = [ax + dir * 42, ay - 62], p2 = [p1[0] + dir * tw, p1[1]];
  const seg1 = Math.hypot(42, 62), total = seg1 + tw, grow = eio(calloutT / .75) * total;

  if (playing){
    cur.u += dt / STEPS[cur.s].dur;
    if (cur.u >= 1){ if (cur.s < STEPS.length - 1) setPos(cur.s + 1, 0); else { cur.u = 1; playing = false; } }
  }
  updateChips();
  rotY += (rotYT - rotY) * k2; rotX += (rotXT - rotX) * k2; camDist += (camDistT - camDist) * k2;
  world.rotation.set(rotX, rotY, 0);
  camera.position.copy(LOOK).addScaledVector(CAM_DIR, camDist); camera.lookAt(LOOK); camera.updateMatrixWorld();

  const {P, L} = apply(cur.s, cur.u, time);
  showParticles(fxPool, P);
  world.updateMatrixWorld();
  showLabels(L);

  if (!dragging){
    const h = pick();
    hovered = h ? h.part : null;
    if (h && h.part !== calloutKey){ hoverLocal.copy(h.point); world.worldToLocal(hoverLocal); }
  }
  canvas.classList.toggle('hover', !!hovered);
  updateCallout(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
<script>/* kiosk: report activity to the parent program */["pointerdown","keydown","wheel","touchstart"].forEach(e=>addEventListener(e,()=>{try{parent.postMessage("kiosk-activity","*")}catch(_){}},{passive:true}));</script>
</body>
