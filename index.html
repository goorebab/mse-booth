<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="신소재공학과">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#2E2E35">
<title>신소재공학과 전공 소개</title>
<style>
@font-face{font-family:"GM";src:local("Gmarket Sans Bold"),url("assets/GmarketSansBold.otf");font-weight:700}
@font-face{font-family:"GM";src:local("Gmarket Sans Medium"),url("assets/GmarketSansMedium.otf");font-weight:500}
@font-face{font-family:"PT";src:local("Pretendard Regular"),url("assets/Pretendard-Regular.otf");font-weight:400}
@font-face{font-family:"PT";src:local("Pretendard Bold"),url("assets/Pretendard-Bold.otf");font-weight:700}
:root{
  --bg:#ECECEC; --board:#FFFFFF; --ink:#26262B; --ink2:#5E5E66; --mute:#9A9AA2;
  --line:#D6D6DA; --chip:#F2F2F4; --dark:#2E2E35;
  --s1:#3A6EA5; --s2:#2F8F83; --s3:#C0703A;   /* 기초 / 핵심 / 응용 */
  --u: min(1vw, 1.778vh);                       /* 16:9 safe unit */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"PT","Pretendard","Malgun Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transform:translateY(calc(var(--u)*1.5));transition:opacity .45s ease,transform .45s ease}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.gm{font-family:"GM","Gmarket Sans",sans-serif}
.tag{font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.05);letter-spacing:.08em;color:var(--ink2)}

/* ---------- HOME ---------- */
#home{flex-direction:row;align-items:stretch}
.home-left{flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*7)}
.home-left .tag{margin-bottom:calc(var(--u)*1.6)}
.home-title{font-family:"GM";font-weight:700;font-size:calc(var(--u)*6.4);line-height:1.1}
.home-title span{color:var(--mute)}
.home-sub{margin-top:calc(var(--u)*1.8);font-size:calc(var(--u)*1.9);color:var(--ink2);line-height:1.5}
.cta{margin-top:calc(var(--u)*4.5);align-self:flex-start;display:flex;align-items:center;gap:calc(var(--u)*1.4);
  background:var(--dark);color:#fff;border-radius:999px;padding:calc(var(--u)*1.9) calc(var(--u)*3.4);
  font-family:"GM";font-weight:700;font-size:calc(var(--u)*2.5);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(0,0,0,.18);
  animation:pulse 2.6s ease-in-out infinite}
.cta svg{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.cta:active{transform:scale(.97)}
.home-hint{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.2);color:var(--mute)}
.home-right{flex:.9;position:relative;background:#E2E2E5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:calc(var(--u)*12)}
.lattice{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*1.8)}
.lattice i{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;background:#4A4A52;
  animation:breathe 4s ease-in-out infinite}
.lattice i.s{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);margin:calc(var(--u)*.65);background:#B9B9C0}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.5))}}
.lattice-cap{margin-top:calc(var(--u)*2.6);text-align:center;font-family:"GM";font-weight:500;
  font-size:calc(var(--u)*1.3);color:var(--ink2)}
.qr{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*1.2);
  background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(0,0,0,.10)}
.qr img{width:calc(var(--u)*8.5);height:calc(var(--u)*8.5);display:block}
.qr b{display:block;font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.25)}
.qr small{display:block;margin-top:calc(var(--u)*.4);font-size:calc(var(--u)*1.05);color:var(--ink2);line-height:1.4}

/* ---------- TOP BAR ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*2.2) calc(var(--u)*3.5) 0}
.pill{display:flex;align-items:center;gap:calc(var(--u)*.7);background:#fff;border-radius:999px;
  padding:calc(var(--u)*1) calc(var(--u)*1.9);font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.25);
  box-shadow:0 calc(var(--u)*.2) calc(var(--u)*.8) rgba(0,0,0,.08)}
.pill svg{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5)}
.pill:active{transform:scale(.96)}

/* ---------- COURSES ---------- */
.c-head{text-align:center;margin-top:calc(var(--u)*.6)}
.c-head h1{font-family:"GM";font-weight:700;font-size:calc(var(--u)*3.2);margin-top:calc(var(--u)*.6)}
.c-head h1 span{color:var(--mute)}
.c-head p{margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.45);color:var(--ink2)}
.stages{flex:1;min-height:0;display:flex;align-items:stretch;gap:calc(var(--u)*1.2);padding:calc(var(--u)*2.2) calc(var(--u)*3.5) calc(var(--u)*3.2)}
.stage{display:flex;flex-direction:column;gap:calc(var(--u)*1.2);min-width:0}
.stage[data-n="1"] .stage-h em{display:none}
.stage[data-n="3"]{flex:3}.stage[data-n="2"]{flex:2}.stage[data-n="1"]{flex:1.15}
.stage-h{display:flex;align-items:baseline;gap:calc(var(--u)*.8);padding-left:calc(var(--u)*.4);white-space:nowrap;overflow:hidden;flex:none}
.stage-h b{font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.7)}
.stage-h small{font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.05);color:var(--mute);letter-spacing:.06em}
.stage-h em{font-style:normal;font-size:calc(var(--u)*1.15);color:var(--ink2)}
.cards{flex:1;display:flex;gap:calc(var(--u)*1.2)}
.arrow{display:flex;align-items:center;padding-top:calc(var(--u)*3)}
.arrow svg{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);color:var(--mute)}
.card{flex:1;min-width:0;background:var(--board);border-radius:calc(var(--u)*1.4);display:flex;flex-direction:column;
  overflow:hidden;text-align:left;box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(0,0,0,.07);
  transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(calc(var(--u)*-.4));box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.2) rgba(0,0,0,.12)}
.card:active{transform:scale(.98)}
.card .thumb{flex:none;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*2) 0 calc(var(--u)*1.2);
  background:var(--chip)}
.card .thumb .book{height:calc(var(--u)*15)}
.card .meta{padding:calc(var(--u)*1.3) calc(var(--u)*1.3) calc(var(--u)*1.5)}
.card .en{font-family:"GM";font-weight:500;font-size:calc(var(--u)*.85);letter-spacing:.03em;line-height:1.25;min-height:2.5em}
.card h3{font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.8);white-space:nowrap;margin-top:calc(var(--u)*.5)}
.card p{margin-top:calc(var(--u)*.6);word-break:keep-all;font-size:calc(var(--u)*1.15);color:var(--ink2);line-height:1.45}
.card .more{margin-top:calc(var(--u)*1);font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.05);display:flex;align-items:center;gap:calc(var(--u)*.4)}
.card .more svg{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)}

/* book visual */
.book{aspect-ratio:7/9.4;border-radius:calc(var(--u)*.25) calc(var(--u)*.6) calc(var(--u)*.6) calc(var(--u)*.25);overflow:hidden;
  position:relative;background:#fff;box-shadow:calc(var(--u)*.5) calc(var(--u)*.7) calc(var(--u)*1.6) rgba(0,0,0,.28)}
.book img{width:100%;height:100%;object-fit:cover;display:block}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12) 4%,rgba(0,0,0,0) 9%)}
.book.made{background:#1F3B4D;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:9% 10%}
.book.made svg{width:62%;align-self:flex-end;opacity:.9}
.book.made .t1{font-family:"GM";font-weight:700;font-size:1em;line-height:1.1}
.book.made .t2{font-family:"GM";font-weight:500;font-size:.42em;letter-spacing:.08em;opacity:.8;margin-top:.5em}

/* ---------- DETAIL ---------- */
.d-body{flex:1;display:flex;gap:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*3);min-height:0}
.d-left{width:calc(var(--u)*30);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--u)*1.3)}
.d-left .book{width:calc(var(--u)*21);font-size:calc(var(--u)*3.2)}
#d-book{display:flex;justify-content:center}
.d-left .src{font-size:calc(var(--u)*1.05);color:var(--ink2);text-align:center;line-height:1.5}
.d-right{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.d-stage{display:inline-flex;align-self:flex-start;align-items:center;gap:calc(var(--u)*.6);color:#fff;border-radius:999px;
  padding:calc(var(--u)*.45) calc(var(--u)*1.3);font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.05)}
.d-title{display:flex;align-items:baseline;gap:calc(var(--u)*1.4);margin-top:calc(var(--u)*.8)}
.d-title h1{font-family:"GM";font-weight:700;font-size:calc(var(--u)*3.5)}
.d-title span{font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.5);color:var(--mute)}
.d-hook{margin-top:calc(var(--u)*.4);font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.65);color:var(--ink2)}
.d-desc{margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*1.32);line-height:1.6;max-width:62em}
.d-qs{display:flex;flex-direction:column;gap:calc(var(--u)*1);width:100%;margin-top:calc(var(--u)*.6)}
.q{background:#fff;border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*1.1) calc(var(--u)*1.4);display:flex;gap:calc(var(--u)*1);align-items:flex-start}
.q i{font-style:normal;font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.7);line-height:1}
.q div{font-size:calc(var(--u)*1.25);line-height:1.4}
.q small{display:block;margin-top:calc(var(--u)*.3);color:var(--mute);font-size:calc(var(--u)*1.0)}
.toc-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:calc(var(--u)*1.6);padding-bottom:calc(var(--u)*.8);
  border-bottom:1px solid var(--line)}
.toc-h b{font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.55)}
.toc-h small{font-size:calc(var(--u)*1.05);color:var(--mute)}
.toc{flex:1;min-height:0;overflow:auto;margin-top:calc(var(--u)*.4)}
.grp{display:flex;gap:calc(var(--u)*1.4);padding:calc(var(--u)*.6) 0;border-bottom:1px solid var(--line)}
.grp>b{width:calc(var(--u)*11);flex:none;font-family:"GM";font-weight:500;font-size:calc(var(--u)*1.2);padding-top:calc(var(--u)*.4)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.45)}
.chip{background:#fff;border-radius:999px;padding:calc(var(--u)*.35) calc(var(--u)*1);font-size:calc(var(--u)*1.02);white-space:nowrap}
.chip.hl{color:#fff}
.d-nav{display:flex;gap:calc(var(--u)*1)}
.booth{margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*1.2);display:flex;gap:calc(var(--u)*.6);align-items:center;color:var(--ink2)}
.booth b{font-family:"GM";font-weight:700;color:var(--ink)}

/* ---------- RESEARCH (embedded simulators) ---------- */
.labs{display:flex;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.6)}
.lab{display:flex;align-items:center;gap:calc(var(--u)*1.1);background:#fff;border-radius:calc(var(--u)*1.4);
  padding:calc(var(--u)*1.2) calc(var(--u)*1.8) calc(var(--u)*1.2) calc(var(--u)*1.2);text-align:left;
  box-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.2) rgba(0,0,0,.08);transition:transform .2s ease}
.lab:active{transform:scale(.97)}
.lab .ic{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.lab .ic svg{width:55%;height:55%}
.lab b{display:block;font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.7)}
.lab small{display:block;margin-top:calc(var(--u)*.35);font-size:calc(var(--u)*1.1);color:var(--ink2)}
#research .bar{padding:calc(var(--u)*1) calc(var(--u)*2);align-items:center;background:var(--bg)}
#research .r-title{font-family:"GM";font-weight:700;font-size:calc(var(--u)*1.5)}
#research .r-title span{font-weight:500;color:var(--mute);margin-left:calc(var(--u)*.8);font-size:.8em}
#labframe{flex:1;width:100%;border:0;background:#fff;display:block}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="home-left">
    <div class="tag">l DEPARTMENT OF ADVANCED MATERIALS l</div>
    <div class="home-title">신소재<span>공학과</span></div>
    <div class="home-sub">원자 단위로 재료를 설계해<br>새로운 성능을 만드는 학문</div>
    <button class="cta" data-go="courses">어떤 걸 배우나요?
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="labs">
      <button class="lab" data-lab="fuelcell"><span class="ic" style="background:var(--s2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>
        <span><b>연료전지 연구</b><small>수소 연료전지 셀 3D 탐색</small></span></button>
      <button class="lab" data-lab="semicon"><span class="ic" style="background:var(--s1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>
        <span><b>반도체 연구</b><small>유기반도체 C8-BTBT 패터닝</small></span></button>
    </div>
    <div class="home-hint">버튼을 눌러 둘러보세요</div>
  </div>
  <div class="home-right">
    <div class="lattice" id="lattice"></div>
    <div class="lattice-cap">Atoms → Crystal → Material</div>
    <div class="qr">
      <img src="assets/qr_instagram.svg" alt="신소재공학과 학생회 인스타그램 QR">
      <div><b>학생회 인스타그램</b><small>@hnu_advanced_material<br>QR로 팔로우하고 소식 받기</small></div>
    </div>
  </div>
</section>

<!-- COURSES -->
<section class="screen" id="courses">
  <div class="bar">
    <button class="pill" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>처음으로</button>
    <div></div>
  </div>
  <div class="c-head">
    <div class="tag">l CURRICULUM l</div>
    <h1>어떤 걸 <span>배우나요?</span></h1>
    <p>기초 과학에서 출발해 고분자 소재를 만들고, 이해하고, 응용하기까지. 궁금한 과목을 눌러보세요</p>
  </div>
  <div class="stages" id="stages"></div>
</section>

<!-- DETAIL -->
<section class="screen" id="detail">
  <div class="bar">
    <button class="pill" data-go="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>전공 과목 목록</button>
    <div class="d-nav">
      <button class="pill" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span></span></button>
      <button class="pill" id="next"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="d-body">
    <div class="d-left"><div id="d-book"></div><div class="src" id="d-src"></div><div class="d-qs" id="d-qs"></div></div>
    <div class="d-right">
      <div class="d-stage" id="d-stage"></div>
      <div class="d-title"><h1 id="d-name"></h1><span id="d-en"></span></div>
      <div class="d-hook" id="d-hook"></div>
      <div class="d-desc" id="d-desc"></div>
      <div class="booth" id="d-booth"></div>
      <div class="toc-h"><b>목차 한눈에 보기</b><small id="d-count"></small></div>
      <div class="toc" id="d-toc"></div>
    </div>
  </div>
</section>

<!-- RESEARCH -->
<section class="screen" id="research">
  <div class="bar">
    <button class="pill" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>처음으로</button>
    <div class="r-title" id="r-title"></div>
    <button class="pill" id="r-switch"></button>
  </div>
  <iframe id="labframe" src="about:blank" title="연구 시뮬레이션" allow="fullscreen"></iframe>
</section>

<script>
/* ===== 내용 수정은 여기서 ===== */
const LABS = {
  fuelcell:{name:"연료전지 연구", sub:"PEMFC 셀 탐색기", src:"research/fuelcell/index.html"},
  semicon: {name:"반도체 연구",   sub:"C8-BTBT 라인 패터닝", src:"research/semicon/index.html"}
};
const STAGES = [
  {key:"기초", en:"FOUNDATION", color:"var(--s1)", desc:"재료를 이해하는 언어"},
  {key:"핵심", en:"CORE",       color:"var(--s2)", desc:"고분자를 만들고 이해하기"},
  {key:"응용", en:"APPLICATION",color:"var(--s3)", desc:"제품과 첨단 기술로"}
];
const COURSES = [
{
  id:"organic", stage:0, name:"유기화학", en:"Organic Chemistry",
  cover:null, coverTitle:"유기화학", coverEn:"ORGANIC CHEMISTRY",

const $=s=>document.querySelector(s);
const arrowSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const benzene='<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="3"><polygon points="50,8 86,29 86,71 50,92 14,71 14,29"/><circle cx="50" cy="50" r="22"/><line x1="86" y1="29" x2="98" y2="20"/><line x1="14" y1="71" x2="2" y2="80"/></svg>';
function bookHTML(c){
  if(c.cover) return `<div class="book"><img src="${c.cover}" alt="${c.name} 교재 표지"></div>`;
  return `<div class="book made"><div><div class="t1">${c.coverTitle}</div><div class="t2">${c.coverEn}</div></div>${benzene}</div>`;
}

/* lattice on home */
(function(){let h="";for(let r=0;r<6;r++)for(let k=0;k<6;k++){const big=(r+k)%2===0;h+=`<i class="${big?"":"s"}" style="animation-delay:${((r+k)%6)*.35}s"></i>`}$("#lattice").innerHTML=h})();

/* course grid */
(function(){
  let h="";
  STAGES.forEach((s,si)=>{
    const list=COURSES.filter(c=>c.stage===si);
    if(si>0) h+=`<div class="arrow">${arrowSvg}</div>`;
    h+=`<div class="stage" data-n="${list.length}"><div class="stage-h"><b style="color:${s.color}">${s.key}</b><small>${s.en}</small><em>${s.desc}</em></div><div class="cards">`;
    list.forEach(c=>{
      h+=`<button class="card" data-id="${c.id}"><div class="thumb">${bookHTML(c)}</div><div class="meta">
        <div class="en" style="color:${s.color}">${c.en.toUpperCase()}</div><h3>${c.name}</h3><p>${c.hook}</p>
        <div class="more" style="color:${s.color}">자세히 보기 ${arrowSvg}</div></div></button>`;
    });
    h+=`</div></div>`;
  });
  $("#stages").innerHTML=h;
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>openCourse(b.dataset.id));
  document.querySelectorAll(".card .book.made").forEach(b=>b.style.fontSize="calc(var(--u)*1.9)");
})();

let cur=0;
function openCourse(id){
  cur=COURSES.findIndex(c=>c.id===id); const c=COURSES[cur], s=STAGES[c.stage];
  $("#d-book").innerHTML=bookHTML(c);
  $("#d-src").innerHTML=c.src;
  const st=$("#d-stage"); st.textContent=`${s.key} · ${s.en}`; st.style.background=s.color;
  $("#d-name").textContent=c.name; $("#d-en").textContent=c.en;
  $("#d-hook").textContent=c.hook; $("#d-desc").textContent=c.desc;
  $("#d-qs").innerHTML=c.qs.map(q=>`<div class="q"><i style="color:${s.color}">Q</i><div>${q[0]}<small>→ ${q[1]}</small></div></div>`).join("");
  $("#d-booth").innerHTML=c.booth?`<b style="color:${s.color}">부스에서 직접 보기</b> ${c.booth}`:"";
  let n=0;
  $("#d-toc").innerHTML=c.toc.map(g=>`<div class="grp"><b>${g[0]}</b><div class="chips">${g[1].map(x=>{n++;const o=typeof x==="string"?{t:x}:x;
      return `<span class="chip${o.hl?" hl":""}" ${o.hl?`style="background:${s.color}"`:""}>${o.t}</span>`}).join("")}</div></div>`).join("");
  const hasHl=c.toc.some(g=>g[1].some(x=>x.hl));
  $("#d-count").textContent=`총 ${n}장${hasHl?" · 색칠된 장은 신소재·고분자와 바로 연결되는 부분":""}`;
  $("#d-toc").scrollTop=0;
  const p=COURSES[(cur+COURSES.length-1)%COURSES.length], q=COURSES[(cur+1)%COURSES.length];
  $("#prev span").textContent=p.name; $("#next span").textContent=q.name;
  show("detail");
}
$("#prev").onclick=()=>openCourse(COURSES[(cur+COURSES.length-1)%COURSES.length].id);
$("#next").onclick=()=>openCourse(COURSES[(cur+1)%COURSES.length].id);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
  if(id!=="research"){const f=$("#labframe"); if(f.getAttribute("src")!=="about:blank") f.setAttribute("src","about:blank");}
}
let curLab=null;
function openLab(key){
  const L=LABS[key]; curLab=key;
  $("#r-title").innerHTML=`${L.name}<span>${L.sub}</span>`;
  const other=key==="fuelcell"?"semicon":"fuelcell";
  $("#r-switch").innerHTML=`${LABS[other].name} 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  $("#r-switch").onclick=()=>openLab(other);
  if(document.activeElement)document.activeElement.blur();
  const fr=$("#labframe"); fr.onload=()=>{try{fr.contentWindow.focus()}catch(_){}}; fr.setAttribute("src",L.src);
  show("research");
}
document.querySelectorAll("[data-lab]").forEach(b=>b.onclick=()=>openLab(b.dataset.lab));
/* 3D 화면 안에서 만져도 '사용 중'으로 인정 */
addEventListener("message",e=>{if(e.data==="kiosk-activity")resetIdle()});
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));

/* keyboard: ← → 과목 이동, Esc 뒤로 */
document.addEventListener("keydown",e=>{
  const on=document.querySelector(".screen.on").id;
  if(e.key==="Escape"||e.key==="Backspace"){ if(on==="detail")show("courses"); else if(on==="courses"||on==="research")show("home"); }
  if(on==="detail"&&e.key==="ArrowRight")$("#next").click();
  if(on==="detail"&&e.key==="ArrowLeft")$("#prev").click();
  if(on==="home"&&(e.key==="Enter"||e.key===" "))show("courses");
  /* 연료전지 화면: 포커스가 바깥에 있어도 Space로 분해/조립 */
  if(on==="research"&&curLab==="fuelcell"&&(e.code==="Space"||e.key===" ")){e.preventDefault();if(!e.repeat)$("#labframe").contentWindow.postMessage("kiosk-space","*");$("#labframe").focus();}
});
document.addEventListener("contextmenu",e=>e.preventDefault());

/* 90초 동안 아무도 안 만지면 처음 화면으로 */
let idle; const IDLE_MS=90000;
function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>show("home"),IDLE_MS)}
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
resetIdle();

/* 주소 뒤 #courses 또는 #과목id 로 바로 열기 (확인용) */
(function(){const h=decodeURIComponent(location.hash.slice(1));
  if(h==="courses")show("courses"); else if(LABS[h])openLab(h); else if(COURSES.some(c=>c.id===h))openCourse(h);})();

/* 웹앱: 오프라인 저장 (https 주소에서만 동작, 로컬 파일 실행 시에는 무시됨) */
if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
